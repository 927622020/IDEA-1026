services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: idea1026
      POSTGRES_USER: idea1026
      POSTGRES_PASSWORD: idea1026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea1026 -d idea1026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
