[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-1026"
version = "0.1.0"
description = "AI-powered quick-commerce stockout prediction and replenishment platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]
ml = [
  "lightgbm>=4.5",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint]
ignore = ["B008"]
